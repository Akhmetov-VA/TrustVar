version: '3'
services:  
  langchain_backend:
      build: 
        context: .
        target: back
      image: trust_gen:back
      container_name: langchain_backend
      env_file:
      - .env
      ports:
          - "27361:27361"
      restart: on-failure  
      command: python langchain_back/main.py

  runners:
    build:
      context: .
      target: runners
    image: trust_gen:runners
    container_name:  runner_run
    env_file:
      - .env
    command: >
      bash -c " 
      cd /app &&
        python -m runners.run & 
        python -m runners.run_rta_queuer & 
        python -m runners.task_processor & 
        python -m runners.run_sync & 
        python -m runners.run_regexp &
        python -m runners.run_metrics
      "
    depends_on:
      - langchain_backend
    volumes:
      - ./.env:/app/.env
    restart: on-failure  

  streamlit_frontend:
    build: 
      context: .
      target: front
    image: trust_gen:front
    container_name: monitoring
    env_file:
      - .env
    command: python -m streamlit run monitoring/app_main.py --server.port 27366
    depends_on:
      - langchain_backend
    ports:
      - "27366:27366"
    volumes: 
      - ./monitoring:/app/monitoring/
      - ./.env:/app/.env
    restart: on-failure