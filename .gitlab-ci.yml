stages:
  - build
  - deploy

build:
  stage: build
  tags:
    - trust_llm_61
  script:
    - echo "Сборка образов"
    - docker compose -f docker-compose.yml build

deploy:
  stage: deploy
  tags:
    - trust_llm_61
  script:
    - echo "Запуск контейнеров ..."
    - export CURRENT_UID=$(id -u)
    - export CURRENT_GID=$(id -g)
    - docker compose -f docker-compose.yml up -d --build